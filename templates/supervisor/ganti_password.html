{% extends "supervisor/base_supervisor.html" %}
{% block title %}Ganti Password Supervisor{% endblock %}
{% block page_title %}Ganti Password{% endblock %}
{% block breadcrumb %}Ubah password akun supervisor{% endblock %}

{% block content %}
<div style="max-width:480px;">
  <div class="card">
    <div class="card-header">
      <div class="card-title">🔑 Ganti Password Supervisor</div>
    </div>
    <form method="POST">
      <div class="form-group">
        <label>Password Lama</label>
        <input type="password" name="password_lama" required placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Password Baru</label>
        <input type="password" name="password_baru" required placeholder="Minimal 6 karakter">
      </div>
      <div class="form-group">
        <label>Konfirmasi Password Baru</label>
        <input type="password" name="password_ulang" required placeholder="Ulangi password baru">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
        💾 Simpan Password Baru
      </button>
    </form>
  </div>
</div>
{% endblock %}
