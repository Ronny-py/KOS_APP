<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Supervisor — KostPay</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --accent:#7c3aed; --accent2:#4f6ef7; --yellow:#eab308; --red:#ef4444; --green:#22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f1117; color: #e2e8f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: #1a1d27; border: 1px solid #2e3347;
      border-radius: 20px; padding: 44px 40px; width: 420px;
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo .icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 12px;
    }
    .logo h1 { font-size: 24px; font-weight: 800; }
    .logo p   { font-size: 13px; color: #8892a4; margin-top: 4px; }
    .sv-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(124,58,237,.15); border: 1px solid rgba(124,58,237,.3);
      color: #a78bfa; border-radius: 20px; padding: 4px 14px; font-size: 12px;
      font-weight: 700; margin-top: 8px;
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #8892a4; margin-bottom: 6px; }
    input {
      width: 100%; background: #222535; border: 1px solid #2e3347;
      border-radius: 10px; padding: 12px 16px; color: #e2e8f0;
      font-family: inherit; font-size: 14px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%; padding: 13px; color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px; font-family: inherit;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .alert-danger  { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.25); color: var(--red); }
    .alert-success { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.25); color: var(--green); }
    .hint { text-align: center; font-size: 12px; color: #8892a4; margin-top: 20px; }
    .back-link { text-align: center; margin-top: 14px; }
    .back-link a { font-size: 12px; color: #8892a4; text-decoration: none; }
    .back-link a:hover { color: #e2e8f0; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="icon">🔍</div>
    <h1>KostPay</h1>
    <p>Panel Supervisor</p>
    <div class="sv-badge">🛡️ Supervisor Access</div>
  </div>

  {% for msg in get_flashed_messages(category_filter=['danger']) %}
    <div class="alert alert-danger">{{ msg }}</div>
  {% endfor %}
  {% for msg in get_flashed_messages(category_filter=['success']) %}
    <div class="alert alert-success">{{ msg }}</div>
  {% endfor %}

  <form method="POST">
    <div class="form-group">
      <label>Username Supervisor</label>
      <input type="text" name="username" placeholder="supervisor" autofocus required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">🔐 Masuk sebagai Supervisor</button>
  </form>

  <div class="hint">Default: supervisor / supervisor123</div>
  <div class="back-link"><a href="{{ url_for('auth.login') }}">← Kembali ke Login Admin</a></div>
</div>
</body>
</html>
